<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Tareas (Frontend Separado)</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --success-color: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.15) 0px, transparent 50%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin-top: 2rem;
        }

        h1, h2 {
            font-weight: 700;
            margin-bottom: 1.5rem;
            text-align: center;
            background: linear-gradient(to right, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            font-size: 0.95rem;
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: scale(1.05);
        }

        .btn-danger {
            background-color: var(--danger-color);
        }

        .btn-danger:hover {
            background-color: var(--danger-hover);
        }
        
        .btn-outline {
            background-color: transparent;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
        }
        
        .btn-outline:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .task-list {
            list-style: none;
            margin-top: 2rem;
            display: grid;
            gap: 1rem;
        }

        .task-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .task-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .task-info {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .task-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .task-status {
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-badge {
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-completed {
            background-color: rgba(16, 185, 129, 0.2);
            color: var(--success-color);
        }

        .status-pending {
            background-color: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

        .task-actions {
            display: flex;
            gap: 0.75rem;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #cbd5e1;
        }

        .form-group input[type="text"],
        .form-group textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            font-family: 'Outfit', sans-serif;
        }

        .form-group input[type="text"]:focus,
        .form-group textarea:focus {
            border-color: var(--primary-color);
        }
        
        .form-checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 0;
            opacity: 0.7;
        }

        /* ---- Vista de Formulario (crear/editar) ---- */
        #vistaFormulario {
            display: none;
        }

        /* ---- Modal de confirmación ---- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 2rem;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
        }

        .modal-content h1 {
            background: var(--danger-color);
            -webkit-background-clip: text;
        }

        .modal-content p {
            margin: 0.5rem 0;
        }

        .modal-actions {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <!-- ===== VISTA: Lista de Tareas ===== -->
    <div class="container" id="vistaLista">
        <div class="card">
            <div class="top-bar">
                <h1>Mis Tareas ✨</h1>
                <button class="btn" onclick="mostrarFormulario()">+ Nueva Tarea</button>
            </div>

            <ul class="task-list" id="listaTareas">
                <!-- Las tareas se inyectan aquí con JavaScript -->
            </ul>
        </div>
    </div>

    <!-- ===== VISTA: Formulario Crear/Editar ===== -->
    <div class="container" id="vistaFormulario">
        <div class="card">
            <h1 id="formTitulo">Nueva Tarea ✨</h1>
            
            <form onsubmit="guardarTarea(event)" style="margin-top: 2rem;">
                <input type="hidden" id="tareaId">
                
                <div class="form-group">
                    <label for="tituloInput">Título de la Tarea:</label>
                    <input type="text" id="tituloInput" placeholder="Ej: Ir al gimnasio">
                </div>
                
                <div class="form-group">
                    <label for="descripcionInput">Descripción (Opcional):</label>
                    <textarea id="descripcionInput" rows="3" placeholder="Detalles adicionales..."></textarea>
                </div>
                
                <div class="form-group form-checkbox">
                    <input type="checkbox" id="completadaInput">
                    <label for="completadaInput" style="margin-bottom: 0;">Marcar como completada</label>
                </div>

                <div style="margin-top: 2rem; display: flex; gap: 1rem;">
                    <button type="submit" class="btn">Guardar Tarea</button>
                    <button type="button" class="btn btn-outline" onclick="mostrarLista()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== MODAL: Confirmar Eliminación ===== -->
    <div class="modal-overlay" id="modalEliminar">
        <div class="modal-content">
            <h1>Eliminar Tarea ⚠️</h1>
            <div style="margin: 2rem 0; font-size: 1.1rem;">
                <p>¿Estás completamente seguro de que deseas eliminar la tarea:</p>
                <p><strong id="modalTareaTitulo" style="font-size: 1.5rem; color: white;"></strong>?</p>
                <p style="opacity: 0.7; font-size: 0.9rem; margin-top: 1rem;">Esta acción no se puede deshacer.</p>
            </div>
            <div class="modal-actions">
                <button class="btn btn-danger" onclick="confirmarEliminar()">Sí, eliminar permanentemente</button>
                <button class="btn btn-outline" onclick="cerrarModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
